findings:
  - id: "ADJ-01"
    title: "Duplicate-hash short-circuit can return a pre-existing asset without applying delivery_report classification or preview_allowed access"
    claim: >-
      import_report delegates to import_content, whose global, type-agnostic duplicate-hash check
      (_find_by_hash, import_index.py ~654-660) scans ALL non-tombstoned assets by content hash
      regardless of artifact_type_id/sensitivity/agent_access. With the default
      on_duplicate='return_existing' (used by both the service default and cmd_report_ingest), a
      hash match on re-ingest or a coincidental collision with a prior non-report asset returns the
      EXISTING asset unchanged -- never applying artifact_type_id='delivery_report',
      agent_access='preview_allowed', mime_type='text/html', or the new envelope metadata. This
      means GET /api/preview/asset/{id}/html can still 403 on this path, directly threatening the
      pinned M1 AC ('an envelope-driven ingest creates a delivery_report Asset whose .../html
      returns 200, not 403'). This is also a check-then-act (TOCTOU) race under concurrent writers,
      and produces no audit trail/warning when it happens. No test in test_report_ingest.py
      exercises a true duplicate hit through import_report -- the suite explicitly routes around it
      via on_duplicate='create_new' for unrelated title-fallback tests.
    finding_type: "bug"
    severity: "medium"
    confidence: "high"
    disposition: "accepted"
    evidence:
      - source: "api/app/services/import_index.py"
        excerpt_or_locator: "lines 262-281 (import_content dedup path) and 654-660 (_find_by_hash) — \"existing = self._find_by_hash(hash_sha256)\\n if existing is not None:\\n     ...\\n     return ImportResult(asset=existing, is_duplicate=True, duplicate_of=existing.id)\""
        why_it_matters: "Shows the duplicate-hash short-circuit returns the pre-existing asset object verbatim with no re-classification step, so a hash hit never reaches the artifact_type_id/agent_access/mime_type upgrade logic."
      - source: "api/app/services/import_index.py"
        excerpt_or_locator: "import_report -> import_content call (~lines 501-515) — \"on_duplicate=on_duplicate,  # defaults to 'return_existing'\""
        why_it_matters: "Confirms import_report inherits the same default and does not override on_duplicate to force re-classification for the report path."
      - source: "api/tests/test_report_ingest.py"
        excerpt_or_locator: "grep for 'duplicate' — \"assert result.is_duplicate is False (line 77) -- no test covers a true duplicate hit against import_report\""
        why_it_matters: "Demonstrates the test suite has no coverage of the degraded path, so a regression here would ship undetected."
      - source: "reviewer:task-completion-validator (correctness)"
        excerpt_or_locator: "CORR-01"
        why_it_matters: "Independent correctness-lens confirmation of the same code path."
      - source: "reviewer:council-review-lens (concurrency)"
        excerpt_or_locator: "TOCTOU finding on the same _find_by_hash check-then-act sequence"
        why_it_matters: "Independent concurrency-lens confirmation that the same check-then-act sequence is racy under concurrent writers."
      - source: "reviewer:adversarial-trace"
        excerpt_or_locator: "traced duplicate-hash path bypassing access/mime/type upgrade with no audit trail; confirmed the suite routes around it via on_duplicate=\"create_new\""
        why_it_matters: "Independent adversarial trace confirming no audit trail is produced when the degraded path fires, and confirming the test-suite avoidance pattern."
    affected_workflows:
